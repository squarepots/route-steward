name: final lifecycle cleanup
on:
  push:
    branches: [work/lifecycle-review-tools]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/lifecycle-review-tools
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply final cleanup
        run: python3 .github/final-cleanup.py
      - name: Validate native code
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/steward
          go mod verify
          go test ./... -timeout 180s
          go vet ./...
          git diff --check
      - name: Validate Worker
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npm run types
          npm run typecheck
          npm test
          npm run deploy:dry-run
      - name: Repository contract checks
        shell: pwsh
        run: |
          ./scripts/Check-NoSecrets.ps1
          ./scripts/Test-Templates.ps1
          ./tests/Test-Version.ps1
          ./tests/Test-Agent.ps1
      - name: Build release artifacts and installed journey
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/Build-ReleaseArtifacts.sh
          mkdir -p "$RUNNER_TEMP/route-steward-release"
          tar -xzf "dist/route-steward_$(tr -d '\r\n' < version.txt)_linux_amd64.tar.gz" -C "$RUNNER_TEMP/route-steward-release"
          ROUTE_STEWARD_BINARY="$RUNNER_TEMP/route-steward-release/route-steward" go test ./tests/userjourney
      - name: Remove temporary harness and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/final-cleanup.py .github/workflows/final-cleanup.yml
          git add -A
          git config user.name squarepots
          git config user.email 46488165+squarepots@users.noreply.github.com
          git commit -s -m "Complete proxy lifecycle simplification"
          git push origin HEAD:work/lifecycle-review-tools
