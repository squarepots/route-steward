name: validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/subscription-publication-state
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Regenerate and commit Worker lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npm install --package-lock-only --ignore-scripts --no-audit
          cd ..
          git config user.name squarepots
          git config user.email 46488165+squarepots@users.noreply.github.com
          git add worker/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "Update Worker lockfile"
          git push origin HEAD:fix/subscription-publication-state
