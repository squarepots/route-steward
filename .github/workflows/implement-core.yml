name: implement lifecycle core
on:
  push:
    branches: [work/lifecycle-review-tools]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/lifecycle-review-tools
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: true
      - name: Apply reviewed changes
        run: |
          python3 .github/implement-core.py
          python3 .github/fix-core.py
      - name: Format and validate native code
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/steward
          go mod verify
          go test ./... -timeout 180s
          go vet ./...
          git diff --check
      - name: Repository contract checks
        shell: pwsh
        run: |
          ./scripts/Check-NoSecrets.ps1
          ./scripts/Test-Templates.ps1
          ./tests/Test-Version.ps1
          ./tests/Test-Agent.ps1
      - name: Remove temporary implementation harness and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/implement-core.py .github/fix-core.py .github/workflows/implement-core.yml .github/workflows/review-workspace.yml
          git add -A
          git config user.name squarepots
          git config user.email 46488165+squarepots@users.noreply.github.com
          git commit -s -m "Refine lifecycle state and delivery boundaries"
          git push origin HEAD:work/lifecycle-review-tools
