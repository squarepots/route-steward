name: review workspace
on:
  push:
    branches: [work/lifecycle-review-tools]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.0
          cache: false
      - name: Export public source and reproducible development tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/review/source.tar.gz"
          go mod download
          go test ./... -timeout 180s > "$RUNNER_TEMP/review/baseline.log" 2>&1
          tar -czf "$RUNNER_TEMP/review/go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/review/modules.tar.gz" -C "$(go env GOPATH)/pkg" mod
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: ${{ runner.temp }}/review/
          retention-days: 3
